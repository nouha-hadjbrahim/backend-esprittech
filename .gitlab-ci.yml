stages:
  - validate
  - test
  - sonar
  - package
  - docker-build-push

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  GIT_DEPTH: "0"
  DOCKER_IMAGE_NAME: "kmokaddem/catalogue_industrialisation_esprit-tech"

cache:
  key: ${CI_PROJECT_NAME}
  policy: pull-push
  paths:
    - .m2/repository
    - .sonar/cache

.maven-job:
  image: maven:3.9-eclipse-temurin-17
  before_script:
    # Keep Maven cache local to the project directory so GitLab can reuse it safely.
    - mkdir -p .m2/repository .sonar/cache

validate-backend:
  stage: validate
  extends: .maven-job
  script:
    - mvn validate
  rules:
    - if: '$CI_PIPELINE_SOURCE'

test-backend:
  stage: test
  extends: .maven-job
  script:
    - mvn clean verify
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/
    reports:
      junit: target/surefire-reports/*.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE'

sonarqube-backend:
  stage: sonar
  extends: .maven-job
  needs:
    - job: test-backend
      artifacts: true
  script:
    - |
      if [ -z "$SONAR_HOST_URL" ]; then
        echo "SONAR_HOST_URL is not set."
        exit 1
      fi

      case "$SONAR_HOST_URL" in
        http://*|https://*) ;;
        *)
          echo "SONAR_HOST_URL must start with http:// or https://"
          exit 1
          ;;
      esac

      if [ -z "$SONAR_TOKEN" ]; then
        echo "SONAR_TOKEN is not set."
        exit 1
      fi

      mvn verify sonar:sonar -Dsonar.qualitygate.wait=true -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

package-backend:
  stage: package
  extends: .maven-job
  script:
    - mvn clean package -DskipTests
  artifacts:
    expire_in: 1 week
    paths:
      - target/*.jar
  rules:
    - if: '$CI_PIPELINE_SOURCE'

docker-build-push:
  stage: docker-build-push
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: test-backend
      artifacts: true
    - job: sonarqube-backend
      optional: true
    - job: package-backend
      artifacts: true
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t "$DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA" -t "$DOCKER_IMAGE_NAME:latest" .
    - docker push "$DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKER_IMAGE_NAME:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

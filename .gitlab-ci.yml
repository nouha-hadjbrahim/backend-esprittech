workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - when: never

stages:
  - validate
  - test
  - coverage
  - dependency-scan
  - secret-scan
  - sonarqube
  - package
  - docker-build
  - image-scan
  - publish
  - trigger-deployment

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B"
  GIT_DEPTH: "0"
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  TRIVY_NO_PROGRESS: "true"
  IMAGE_OCI_ARCHIVE: "image.oci.tar"
  IMAGE_METADATA: "image.env"
  BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"

default:
  interruptible: true

cache:
  key: "${CI_PROJECT_NAME}-maven"
  policy: pull-push
  paths:
    - .m2/repository/

.maven-job:
  image: maven:3.9.9-eclipse-temurin-17
  before_script:
    - mkdir -p .m2/repository
    - mvn --version

.buildkit-job:
  image:
    name: moby/buildkit:v0.15.2-rootless
    entrypoint: [""]
  before_script:
    - mkdir -p "$HOME/.docker"
    - umask 077
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > "$HOME/.docker/config.json"

.skopeo-job:
  image:
    name: quay.io/skopeo/stable:v1.15.2
    entrypoint: [""]
  before_script:
    - mkdir -p "$HOME/.docker"
    - umask 077
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > "$HOME/.docker/config.json"

.trivy-job:
  image:
    name: aquasec/trivy:0.54.1
    entrypoint: [""]
  cache:
    key: "${CI_PROJECT_NAME}-trivy"
    policy: pull-push
    paths:
      - .trivycache/

validate-backend:
  stage: validate
  extends: .maven-job
  script:
    - mvn $MAVEN_CLI_OPTS validate

test-backend:
  stage: test
  extends: .maven-job
  script:
    - mvn $MAVEN_CLI_OPTS clean verify
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/
    reports:
      junit:
        - target/surefire-reports/*.xml

coverage-gate:
  stage: coverage
  extends: .maven-job
  needs:
    - job: test-backend
      artifacts: true
  script:
    - test -f target/site/jacoco/jacoco.xml
    - mvn $MAVEN_CLI_OPTS -DskipTests jacoco:check
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/site/jacoco/

dependency-scan-trivy:
  stage: dependency-scan
  extends: .trivy-job
  script:
    - mkdir -p target/trivy
    - trivy --version
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --format table --output target/trivy/dependency-scan.txt .
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/trivy/

secret-scan-trivy:
  stage: secret-scan
  extends: .trivy-job
  script:
    - mkdir -p target/trivy
    - trivy --version
    - trivy fs --scanners secret --format table --output target/trivy/secret-scan.txt --exit-code 1 .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/trivy/secret-scan.txt

sonarqube-analysis:
  stage: sonarqube
  extends: .maven-job
  needs:
    - job: test-backend
      artifacts: true
    - job: coverage-gate
      artifacts: true
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  cache:
    key: "${CI_PROJECT_NAME}-sonar"
    policy: pull-push
    paths:
      - .sonar/cache/
  script:
    - |
      for variable_name in SONAR_HOST_URL SONAR_TOKEN SONAR_PROJECT_KEY SONAR_ORGANIZATION; do
        eval "variable_value=\${$variable_name:-}"
        if [ -z "$variable_value" ]; then
          echo "$variable_name is not configured. Add it as a protected masked GitLab CI/CD variable."
          exit 1
        fi
      done
    - test -f target/site/jacoco/jacoco.xml
    - >
      mvn $MAVEN_CLI_OPTS sonar:sonar
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.organization="$SONAR_ORGANIZATION"
      -Dsonar.qualitygate.wait=true
      -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

package-backend:
  stage: package
  extends: .maven-job
  needs:
    - job: test-backend
      artifacts: true
  script:
    - test -n "$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' -print -quit)"
    - find target -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' -print
  artifacts:
    expire_in: 1 week
    paths:
      - target/*.jar

docker-build-oci:
  stage: docker-build
  extends: .buildkit-job
  needs:
    - job: package-backend
      artifacts: true
  script:
    - test -n "$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' -print -quit)"
    - rm -f "$IMAGE_OCI_ARCHIVE"
    - >
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR"
      --opt filename=Dockerfile
      --output "type=oci,dest=$IMAGE_OCI_ARCHIVE,name=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - test -s "$IMAGE_OCI_ARCHIVE"
  artifacts:
    expire_in: 1 day
    paths:
      - image.oci.tar

image-scan-trivy:
  stage: image-scan
  extends: .trivy-job
  needs:
    - job: docker-build-oci
      artifacts: true
  script:
    - test -s "$IMAGE_OCI_ARCHIVE"
    - mkdir -p target/trivy
    - trivy image --input "$IMAGE_OCI_ARCHIVE" --severity HIGH,CRITICAL --format table --output target/trivy/image-scan.txt
    - trivy image --input "$IMAGE_OCI_ARCHIVE" --severity HIGH,CRITICAL --exit-code 1
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/trivy/image-scan.txt

publish-image:
  stage: publish
  extends: .skopeo-job
  needs:
    - job: docker-build-oci
      artifacts: true
    - job: image-scan-trivy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - when: never
  script:
    - test -s "$IMAGE_OCI_ARCHIVE"
    - skopeo copy --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "oci-archive:$IMAGE_OCI_ARCHIVE" "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - skopeo copy --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "oci-archive:$IMAGE_OCI_ARCHIVE" "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        case "$CI_COMMIT_TAG" in
          v*) skopeo copy --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "oci-archive:$IMAGE_OCI_ARCHIVE" "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" ;;
        esac
      fi
    - IMAGE_DIGEST="$(skopeo inspect --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" --format '{{.Digest}}' "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA")"
    - |
      {
        echo "IMAGE_REPOSITORY=$CI_REGISTRY_IMAGE"
        echo "IMAGE_TAG=$CI_COMMIT_SHA"
        echo "IMAGE_DIGEST=$IMAGE_DIGEST"
        echo "SOURCE_COMMIT_SHA=$CI_COMMIT_SHA"
        echo "SOURCE_PROJECT_PATH=$CI_PROJECT_PATH"
      } > "$IMAGE_METADATA"
  artifacts:
    expire_in: 1 week
    reports:
      dotenv: image.env
    paths:
      - image.env

trigger-deployment:
  stage: trigger-deployment
  needs:
    - job: publish-image
      artifacts: true
  resource_group: deployment-trigger
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - when: never
  trigger:
    project: mokaddemkarim89/deployment_industproject
    branch: main
    strategy: mirror
  variables:
    CHANGED_COMPONENT: "spring"
    CHANGED_IMAGE_REPOSITORY: "$CI_REGISTRY_IMAGE"
    CHANGED_IMAGE_TAG: "$CI_COMMIT_SHA"
    SOURCE_PROJECT_PATH: "$CI_PROJECT_PATH"
    SOURCE_COMMIT_SHA: "$CI_COMMIT_SHA"
    SOURCE_PIPELINE_ID: "$CI_PIPELINE_ID"

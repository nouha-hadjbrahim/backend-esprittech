workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - validate
  - test
  - dependency-scan
  - coverage-gate
  - sonarqube
  - package
  # - docker-build-push

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  GIT_DEPTH: "0"

cache:
  key: ${CI_PROJECT_NAME}
  policy: pull-push
  paths:
    - .m2/repository
    - .dependency-check-data

.maven-job:
  image: maven:3.9-eclipse-temurin-17
  before_script:
    - mkdir -p .m2/repository
    - mkdir -p .dependency-check-data

validate-backend:
  stage: validate
  extends: .maven-job
  script:
    - mvn validate

test-backend:
  stage: test
  extends: .maven-job
  script:
    - mvn clean verify
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/
    reports:
      junit: target/surefire-reports/*.xml

dependency-check-maven:
  stage: dependency-scan
  extends: .maven-job
  script:
    # OWASP Dependency-Check scans Maven dependencies.
    # failBuildOnCVSS=7 blocks HIGH and CRITICAL vulnerable dependencies.
    # NVD_API_KEY must be stored in GitLab CI/CD variables, not in this file.
    # Extra NVD options reduce timeout/rate-limit failures during the first database update.
    - mkdir -p target/dependency-check-report
    - >
      mvn -DskipTests
      org.owasp:dependency-check-maven:12.1.0:check
      -DfailBuildOnCVSS=7
      -Dformats=HTML,JSON,XML
      -Dodc.outputDirectory=target/dependency-check-report
      -DdataDirectory="$CI_PROJECT_DIR/.dependency-check-data"
      -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
      -DnvdValidForHours=24
      -DnvdMaxRetryCount=20
      -DnvdApiDelay=6000
      -DnvdApiResultsPerPage=1000
      -DprettyPrint=true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/dependency-check-report/

coverage-gate:
  stage: coverage-gate
  extends: .maven-job
  dependencies:
    - test-backend
  script:
    - |
      echo "Checking JaCoCo instruction coverage threshold: minimum 80%"

      REPORT="target/site/jacoco/jacoco.xml"

      if [ ! -f "$REPORT" ]; then
        echo "ERROR: JaCoCo report not found at $REPORT"
        exit 1
      fi

      COUNTER=$(grep -o '<counter type="INSTRUCTION" missed="[0-9]*" covered="[0-9]*"' "$REPORT" | tail -n 1)

      MISSED=$(echo "$COUNTER" | grep -o 'missed="[0-9]*"' | grep -o '[0-9]*')
      COVERED=$(echo "$COUNTER" | grep -o 'covered="[0-9]*"' | grep -o '[0-9]*')
      TOTAL=$((MISSED + COVERED))

      if [ "$TOTAL" -eq 0 ]; then
        echo "ERROR: No JaCoCo instruction coverage data found."
        exit 1
      fi

      COVERAGE=$(awk "BEGIN { printf \"%.2f\", ($COVERED / $TOTAL) * 100 }")

      echo "Instruction coverage: $COVERAGE%"

      awk "BEGIN { exit !($COVERAGE >= 80) }" || {
        echo "ERROR: Coverage is below 80%. Merge blocked."
        exit 1
      }

      echo "Coverage is >= 80%. OK."

sonarqube-analysis:
  stage: sonarqube
  extends: .maven-job
  dependencies:
    - test-backend
  script:
    # SonarCloud checks its available Quality Gate. Coverage >= 80% is enforced by coverage-gate.
    - >
      mvn sonar:sonar
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.organization="$SONAR_ORGANIZATION"
      -Dsonar.qualitygate.wait=true
      -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

package-backend:
  stage: package
  extends: .maven-job
  script:
    - mvn clean package -DskipTests
  artifacts:
    expire_in: 1 week
    paths:
      - target/*.jar


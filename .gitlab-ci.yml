# Run CI only where it protects main:
# - Merge Request pipelines targeting main
# - Push pipelines created by commits merged/pushed to main
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - validate
  - test
  - dependency-scan
  - sonarqube
  - package
  # Docker publishing stays disabled until image delivery is ready.
  # - docker-build-push

variables:
  # Reuse Maven dependencies between jobs and pipelines.
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  # SonarQube needs full history for accurate blame and MR decoration.
  GIT_DEPTH: "0"
  # Keep the Docker image name for the future disabled job.
  # DOCKER_IMAGE_NAME: "kmokaddem/catalogue_industrialisation_esprit-tech"

cache:
  key: ${CI_PROJECT_NAME}
  policy: pull-push
  paths:
    - .m2/repository

.maven-job:
  image: maven:3.9-eclipse-temurin-17
  before_script:
    # Keep Maven cache local to the project directory so GitLab can reuse it.
    - mkdir -p .m2/repository

validate-backend:
  stage: validate
  extends: .maven-job
  script:
    - mvn validate

test-backend:
  stage: test
  extends: .maven-job
  script:
    # JaCoCo is bound to Maven verify in pom.xml and writes target/site/jacoco/jacoco.xml.
    - mvn clean verify
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/
    reports:
      junit: target/surefire-reports/*.xml

dependency-check-maven:
  stage: dependency-scan
  extends: .maven-job
  script:
    # failBuildOnCVSS=7 blocks HIGH and CRITICAL vulnerable dependencies.
    - >
      mvn -DskipTests
      org.owasp:dependency-check-maven:12.1.0:check
      -DfailBuildOnCVSS=7
      -Dformat=HTML,JSON,XML
      -Dodc.outputDirectory=target/dependency-check-report
      -DprettyPrint=true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/dependency-check-report/

sonarqube-analysis:
  stage: sonarqube
  extends: .maven-job
  dependencies:
    - test-backend
  script:
    # The Quality Gate threshold, including coverage >= 80%, is configured in SonarQube.
    - >
      mvn sonar:sonar
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.qualitygate.wait=true
      -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

package-backend:
  stage: package
  extends: .maven-job
  script:
    - mvn clean package -DskipTests
  artifacts:
    expire_in: 1 week
    paths:
      - target/*.jar


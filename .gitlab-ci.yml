# Run CI only where it protects main:
# - Merge Request pipelines targeting main
# - Push pipelines created by commits merged/pushed to main
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - validate
  - test
  - xray
  - sonarqube
  - package
  # Docker publishing stays disabled until image delivery is ready.
  # - docker-build-push

variables:
  # Reuse Maven dependencies between jobs and pipelines.
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  # SonarQube needs full history for accurate blame and MR decoration.
  GIT_DEPTH: "0"
  # Keep the Docker image name for the future disabled job.
  # DOCKER_IMAGE_NAME: "kmokaddem/catalogue_industrialisation_esprit-tech"

cache:
  key: ${CI_PROJECT_NAME}
  policy: pull-push
  paths:
    - .m2/repository

.maven-job:
  image: maven:3.9-eclipse-temurin-17
  before_script:
    # Keep Maven cache local to the project directory so GitLab can reuse it.
    - mkdir -p .m2/repository

validate-backend:
  stage: validate
  extends: .maven-job
  script:
    - mvn validate

test-backend:
  stage: test
  extends: .maven-job
  script:
    # JaCoCo is bound to Maven verify in pom.xml and writes target/site/jacoco/jacoco.xml.
    - mvn clean verify
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/
    reports:
      junit: target/surefire-reports/*.xml

xray-dependency-scan:
  stage: xray
  extends: .maven-job
  script:
    # These GitLab CI/CD variables must be configured in project/group settings.
    - |
      if [ -z "$JF_URL" ] || [ -z "$JF_ACCESS_TOKEN" ] || [ -z "$XRAY_WATCHES" ]; then
        echo "JF_URL, JF_ACCESS_TOKEN, and XRAY_WATCHES GitLab CI variables are required."
        exit 1
      fi
    # Install JFrog CLI in the Maven image, then scan Maven dependencies with the configured Xray watches.
    - |
      if ! command -v curl >/dev/null 2>&1; then
        apt-get update
        apt-get install -y --no-install-recommends curl ca-certificates
      fi
      if ! command -v jf >/dev/null 2>&1; then
        curl -fL https://install-cli.jfrog.io | sh
      fi
    - jf --version
    - jf config add gitlab-ci --url="$JF_URL" --access-token="$JF_ACCESS_TOKEN" --interactive=false
    - mvn -DskipTests dependency:go-offline
    # --fail=true makes matching Xray watch/fail-rule violations block the pipeline.
    - jf audit --mvn --server-id=gitlab-ci --watches="$XRAY_WATCHES" --fail=true

sonarqube-analysis:
  stage: sonarqube
  extends: .maven-job
  dependencies:
    - test-backend
  script:
    # The Quality Gate threshold, including coverage >= 80%, is configured in SonarQube.
    - >
      mvn sonar:sonar
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.qualitygate.wait=true
      -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

package-backend:
  stage: package
  extends: .maven-job
  script:
    - mvn clean package -DskipTests
  artifacts:
    expire_in: 1 week
    paths:
      - target/*.jar


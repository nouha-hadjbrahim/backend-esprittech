workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - when: never

stages:
  - validate
  - test
  - coverage
  - dependency-scan
  - secret-scan
  - sonarqube
  - package
  - docker-build
  - image-scan
  - publish

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B"
  GIT_DEPTH: "0"
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  TRIVY_NO_PROGRESS: "true"
  IMAGE_TAR: "image.tar"

default:
  interruptible: true

cache:
  key: "${CI_PROJECT_NAME}-maven"
  policy: pull-push
  paths:
    - .m2/repository/

.maven-job:
  image: maven:3.9-eclipse-temurin-17
  before_script:
    - mkdir -p .m2/repository
    - mvn --version

.kaniko-job:
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > /kaniko/.docker/config.json

validate-backend:
  stage: validate
  extends: .maven-job
  script:
    - mvn $MAVEN_CLI_OPTS validate

test-backend:
  stage: test
  extends: .maven-job
  script:
    - mvn $MAVEN_CLI_OPTS clean verify
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/
    reports:
      junit:
        - target/surefire-reports/*.xml

coverage-gate:
  stage: coverage
  extends: .maven-job
  needs:
    - job: test-backend
      artifacts: true
  script:
    - test -f target/site/jacoco/jacoco.xml
    - mvn $MAVEN_CLI_OPTS -DskipTests jacoco:check
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/site/jacoco/

dependency-scan-trivy:
  stage: dependency-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  cache:
    key: "${CI_PROJECT_NAME}-trivy"
    policy: pull-push
    paths:
      - .trivycache/
  script:
    - mkdir -p target/trivy
    - trivy --version
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --format table --output target/trivy/dependency-scan.txt .
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/trivy/

secret-scan-trivy:
  stage: secret-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  cache:
    key: "${CI_PROJECT_NAME}-trivy"
    policy: pull-push
    paths:
      - .trivycache/
  script:
    - mkdir -p target/trivy
    - trivy --version
    - trivy fs --scanners secret --format table --output target/trivy/secret-scan.txt --exit-code 1 .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/trivy/secret-scan.txt

sonarqube-analysis:
  stage: sonarqube
  extends: .maven-job
  needs:
    - job: test-backend
      artifacts: true
    - job: coverage-gate
      artifacts: true
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  cache:
    key: "${CI_PROJECT_NAME}-sonar"
    policy: pull-push
    paths:
      - .sonar/cache/
  script:
    - |
      for variable_name in SONAR_HOST_URL SONAR_TOKEN SONAR_PROJECT_KEY SONAR_ORGANIZATION; do
        eval "variable_value=\${$variable_name:-}"
        if [ -z "$variable_value" ]; then
          echo "$variable_name is not configured. Add it as a protected masked GitLab CI/CD variable."
          exit 1
        fi
      done
    - test -f target/site/jacoco/jacoco.xml
    - >
      mvn $MAVEN_CLI_OPTS sonar:sonar
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.organization="$SONAR_ORGANIZATION"
      -Dsonar.qualitygate.wait=true
      -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

package-backend:
  stage: package
  extends: .maven-job
  needs:
    - job: test-backend
      artifacts: true
  script:
    - test -n "$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' -print -quit)"
    - find target -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' -print
  artifacts:
    expire_in: 1 week
    paths:
      - target/*.jar

docker-build-validate:
  stage: docker-build
  extends: .kaniko-job
  needs:
    - job: package-backend
      artifacts: true
  script:
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHA}"
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --destination "$CI_REGISTRY_IMAGE:$IMAGE_TAG" --no-push --tar-path "$IMAGE_TAR"
  artifacts:
    expire_in: 1 day
    paths:
      - image.tar

image-scan-trivy:
  stage: image-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - job: docker-build-validate
      artifacts: true
  cache:
    key: "${CI_PROJECT_NAME}-trivy"
    policy: pull-push
    paths:
      - .trivycache/
  script:
    - mkdir -p target/trivy
    - trivy image --input "$IMAGE_TAR" --severity HIGH,CRITICAL --format table --output target/trivy/image-scan.txt
    - trivy image --input "$IMAGE_TAR" --severity HIGH,CRITICAL --exit-code 1
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/trivy/image-scan.txt

publish-image:
  stage: publish
  extends: .kaniko-job
  needs:
    - job: package-backend
      artifacts: true
    - job: image-scan-trivy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - when: never
  script:
    - |
      DESTINATIONS="--destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        DESTINATIONS="$DESTINATIONS --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
      /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" $DESTINATIONS

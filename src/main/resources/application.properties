# Application
spring.application.name=backend_EspritTech
server.port=${SERVER_PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/esprittech?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# JWT
# JWT_SECRET intentionally defaults to empty so JwtTokenProvider can fail with a clear setup message.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Default admin account
app.admin.email=${ADMIN_EMAIL:admin@esprittech.tn}
app.admin.password=${ADMIN_PASSWORD:Admin@1234}
# Application
spring.application.name=backend_EspritTech

# =====================================================================
# Base de données MySQL
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================================================
# Serveur
# =====================================================================
server.port=${SERVER_PORT}

# =====================================================================
# Upload de fichiers
# =====================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =====================================================================
# MinIO - livrables et preuves industrialisation
# =====================================================================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:esprittech-livrables}
minio.secure=${MINIO_SECURE:false}

# =====================================================================
# Evaluation ML scoring
# =====================================================================
evaluation.ml.enabled=${EVALUATION_ML_ENABLED:true}
evaluation.ml.base-url=${EVALUATION_ML_BASE_URL:http://localhost:8000}
evaluation.ml.recalculation-cooldown-seconds=${EVALUATION_ML_RECALCULATION_COOLDOWN_SECONDS:120}
evaluation.engine=${EVALUATION_ENGINE:multimodal-semantic-v2}
evaluation.shadow-mode=${EVALUATION_SHADOW_MODE:false}
evaluation.criteria-version=${EVALUATION_CRITERIA_VERSION:2026-07}
evaluation.limits.max-file-bytes=${EVALUATION_MAX_FILE_BYTES:5242880}
evaluation.limits.max-pdf-pages=${EVALUATION_MAX_PDF_PAGES:40}
evaluation.limits.max-image-pixels=${EVALUATION_MAX_IMAGE_PIXELS:20000000}
evaluation.limits.max-extracted-chars=${EVALUATION_MAX_EXTRACTED_CHARS:200000}
evaluation.limits.max-semantic-chunks=${EVALUATION_MAX_SEMANTIC_CHUNKS:250}
evaluation.limits.git-clone-timeout-seconds=${EVALUATION_GIT_CLONE_TIMEOUT_SECONDS:30}
evaluation.limits.external-request-timeout-seconds=${EVALUATION_EXTERNAL_REQUEST_TIMEOUT_SECONDS:20}
evaluation.ml.required-engine-version=multimodal-semantic-v2

evaluation.ml.connect-timeout-seconds=10
evaluation.ml.request-timeout-seconds=300

evaluation.ml.max-attempts=2
evaluation.ml.retry-delay-millis=750

evaluation.ml.max-response-chars=20000000

logging.level.tn.esprit.backend_esprittech.service.CritereEval.MlEvaluationClient=INFO



# =====================================================================
# JWT
# =====================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_ACCESS_EXPIRATION}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION}

# =====================================================================
# Cookies d'authentification (les JWT sont déposés en cookies HttpOnly)
# =====================================================================
# secure : true en production (HTTPS obligatoire), false en dev (HTTP).
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
# same-site : Strict bloque l'envoi cross-site du cookie (protection CSRF).
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}

# =====================================================================
# CORS & Admin par défaut
# =====================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# =====================================================================
# Azure Entra ID / Microsoft Graph
# Vérification du rôle (enseignant/étudiant) à l'inscription via l'appartenance
# aux groupes Azure, en remplacement de l'ancien référentiel CSV.
# Les secrets restent dans .env. Les valeurs par défaut vides évitent l'échec
# de résolution des placeholders au démarrage / dans les tests.
# =====================================================================
azure.graph.tenant-id=${AZURE_TENANT_ID:}
azure.graph.client-id=${AZURE_CLIENT_ID:}
azure.graph.client-secret=${AZURE_CLIENT_SECRET:}
azure.graph.enseignant-group-id=${AZURE_ENSEIGNANT_GROUP_ID:b7172758-d6ff-4b27-99a0-c678735397c4}
azure.graph.etudiant-group-id=${AZURE_ETUDIANT_GROUP_ID:bbae5c58-1939-4ce8-bf02-caa847052e31}
azure.graph.login-base-url=${AZURE_LOGIN_BASE_URL:https://login.microsoftonline.com}
azure.graph.api-base-url=${AZURE_GRAPH_API_BASE_URL:https://graph.microsoft.com/v1.0}
# Boîte ESPRIT expéditrice des emails (Graph sendMail, permission Mail.Send).
azure.graph.mail-sender=${AZURE_MAIL_SENDER:}

# =====================================================================
# Vérification de propriété de l'email (code OTP) à l'inscription
# =====================================================================
app.verification.code-ttl-seconds=${VERIFICATION_CODE_TTL_SECONDS:600}
app.verification.max-attempts=${VERIFICATION_MAX_ATTEMPTS:5}
app.verification.resend-cooldown-seconds=${VERIFICATION_RESEND_COOLDOWN_SECONDS:60}

# =====================================================================
# Swagger / OpenAPI
# =====================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs



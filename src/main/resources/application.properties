# Application
spring.application.name=backend_EspritTech

# =====================================================================
# Base de données MySQL
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================================================
# Serveur
# =====================================================================
server.port=${SERVER_PORT}

# =====================================================================
# Upload de fichiers
# =====================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =====================================================================
# MinIO - livrables et preuves industrialisation
# =====================================================================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:esprittech-livrables}
minio.secure=${MINIO_SECURE:false}

# =====================================================================
# Evaluation ML scoring
# =====================================================================
evaluation.ml.enabled=${EVALUATION_ML_ENABLED:true}
evaluation.ml.base-url=${EVALUATION_ML_BASE_URL:http://localhost:8000}
evaluation.ml.recalculation-cooldown-seconds=${EVALUATION_ML_RECALCULATION_COOLDOWN_SECONDS:120}

# =====================================================================
# JWT
# =====================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_ACCESS_EXPIRATION}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION}

# =====================================================================
# Cookies d'authentification (les JWT sont déposés en cookies HttpOnly)
# =====================================================================
# secure : true en production (HTTPS obligatoire), false en dev (HTTP).
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
# same-site : Strict bloque l'envoi cross-site du cookie (protection CSRF).
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}

# =====================================================================
# CORS & Admin par défaut
# =====================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# =====================================================================
# Swagger / OpenAPI
# =====================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

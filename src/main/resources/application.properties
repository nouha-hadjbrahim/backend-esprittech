spring.application.name=backend_EspritTech

# =====================================================================
# Base de données MySQL
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/esprittech?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================================================
# Serveur
# =====================================================================
server.port=${SERVER_PORT:8080}

# =====================================================================
# Upload de fichiers
# =====================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =====================================================================
# JWT (DotenvConfig)
# =====================================================================
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# =====================================================================
# CORS & Admin par défaut
# =====================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.admin.email=${ADMIN_EMAIL:admin@esprittech.tn}
app.admin.password=${ADMIN_PASSWORD:Admin@1234}

# =====================================================================
# Swagger / OpenAPI
# =====================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
